# Render Blueprint for erv.sg (static site). Mirrors public/_headers, which Render ignores.
services:
  - type: web
    runtime: static
    name: erv-sg
    repo: https://github.com/dbasgp/erv-sg
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build && npm run check:drafts
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_WEB3FORMS_KEY
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    domains:
      - www.erv.sg
      - erv.sg
